[package]
name = "file_mover"
version = "0.1.0"
edition = "2021"

[lib]
name = "file_mover"
crate-type = ["cdylib"]

[dependencies]
blake3 = ">=1.8.0, <2.0.0"
thiserror = ">=2.0, <3.0"
libc = ">=0.2.0, <1.0.0"
log = ">=0.4.0, <1.0.0"
parking_lot = ">=0.12, <1.0"
tempfile = ">=3.8.0, <4.0.0"
pyo3 = { version = "0.27.2", features = ["extension-module"] }
pyo3-log = "0.13.2"

[dev-dependencies]
env_logger = ">=0.11.0, <1.0.0"

[features]
default = ["python"]
python = []
